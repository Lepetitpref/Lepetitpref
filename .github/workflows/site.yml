# Publie le site sur GitHub Pages (à chaque push sur main) et relève l'audience toutes les 15 minutes.
# Réglage nécessaire : Settings → Pages → Source = « GitHub Actions ».
# L'adresse de la page d'audience vient du secret AUDIENCE_CLE (Settings → Secrets and variables → Actions) :
# elle n'apparaît jamais dans le dépôt, qui est public.
name: Site et audience
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers du site (sans les outils ni les consignes internes)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude outils --exclude CLAUDE.md --exclude README.md ./ "$RUNNER_TEMP/site/"
      - name: Audience
        env:
          CLE: ${{ secrets.AUDIENCE_CLE }}
        run: |
          if [ -z "$CLE" ]; then echo "Pas de secret AUDIENCE_CLE : pas de page d'audience."; exit 0; fi
          D="$RUNNER_TEMP/site/$CLE"
          mkdir -p "$D"
          node outils/audience.js "$D" --avant "https://lepetitpref.fr/$CLE/" || echo "Relevé impossible cette fois-ci."
          cp outils/audience/index.html "$D/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploiement
        uses: actions/deploy-pages@v4
